<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ece8e1">
  <title>Staircase 3D Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { background:#ece8e1; color:#252525; overscroll-behavior:none; }
    .app { min-height:100vh; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left)); background:rgba(255,255,255,.94); border-bottom:1px solid #cfc9c0; }
    header strong { flex:1 1 230px; font-size:16px; }
    button { min-height:44px; padding:8px 13px; border:1px solid #999; border-radius:10px; background:#fff; color:#222; font:inherit; font-weight:600; touch-action:manipulation; }
    main { flex:1; min-height:520px; position:relative; }
    model-viewer { width:100%; height:calc(100vh - 118px); min-height:520px; background:linear-gradient(#e5e0d8,#f5f2ed); --poster-color:transparent; }
    .help { position:absolute; left:12px; bottom:12px; max-width:min(520px,calc(100% - 24px)); padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.88); color:#444; font-size:12px; line-height:1.35; pointer-events:none; }
    footer { padding:7px max(12px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); background:#fff; border-top:1px solid #cfc9c0; color:#666; font-size:11px; }
    @media (prefers-color-scheme:dark) {
      body { background:#191919; color:#eee; }
      header, footer { background:#242424; border-color:#444; }
      button { background:#333; color:#eee; border-color:#666; }
      model-viewer { background:linear-gradient(#222,#181818); }
      .help { background:rgba(32,32,32,.88); color:#ddd; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <strong>Staircase 3D test model</strong>
    <button type="button" data-view="home">Home</button>
    <button type="button" data-view="top">Top</button>
    <button type="button" data-view="side">Side</button>
    <button type="button" data-view="landing">Landing</button>
  </header>
  <main>
    <model-viewer id="viewer"
      src="staircase_test_approx.glb"
      alt="Approximate 3D reconstruction of the photographed staircase"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      shadow-softness="0.8"
      exposure="1.05"
      interaction-prompt="auto"
      camera-orbit="45deg 68deg 9m"
      min-camera-orbit="auto 15deg 3m"
      max-camera-orbit="auto 88deg 20m"
      field-of-view="38deg">
    </model-viewer>
    <div class="help">One-finger drag: rotate · pinch: zoom · two-finger drag: pan. This first model is an approximate reconstruction from the test photographs, not a measured survey.</div>
  </main>
  <footer>Tomorrow's staircase can use the same viewer: only the GLB model needs replacing.</footer>
</div>
<script>
  const viewer = document.getElementById('viewer');
  const views = {
    home:    { orbit:'45deg 68deg 9m', target:'0m 1.8m 0m', fov:'38deg' },
    top:     { orbit:'0deg 15deg 11m', target:'0m 1.4m 0m', fov:'32deg' },
    side:    { orbit:'90deg 72deg 9m', target:'0m 1.7m 0m', fov:'36deg' },
    landing: { orbit:'-35deg 70deg 6m', target:'0m 2.4m 0m', fov:'38deg' }
  };
  document.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = views[btn.dataset.view];
      viewer.cameraOrbit = v.orbit;
      viewer.cameraTarget = v.target;
      viewer.fieldOfView = v.fov;
      viewer.jumpCameraToGoal();
    });
  });
</script>
</body>
</html>
